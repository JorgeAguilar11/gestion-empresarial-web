<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Acción - Sistema de Gestión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1>🏢 Sistema de Gestión</h1>
            <div class="user-info">
                <span id="userName">Usuario</span>
                <button onclick="logout()" class="btn btn-secondary">Cerrar Sesión</button>
            </div>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            
            <!-- Breadcrumb -->
            <div class="breadcrumb">
                <a href="dashboard.html">Dashboard</a> / Nueva Acción
            </div>
            
            <!-- Formulario -->
            <section class="form-section">
                <h2>📝 Registrar Nueva Acción</h2>
                
                <form id="accionForm">
                    
                    <!-- Tipificación -->
                    <div class="form-group">
                        <label for="tipificacion">Tipificación *</label>
                        <select id="tipificacion" name="tipificacion_id" required>
                            <option value="">Seleccione una tipificación</option>
                        </select>
                        <small class="form-help">Seleccione el tipo de acción que desea registrar</small>
                    </div>
                    
                    <!-- Descripción -->
                    <div class="form-group">
                        <label for="descripcion">Descripción *</label>
                        <textarea 
                            id="descripcion" 
                            name="descripcion" 
                            rows="4" 
                            required
                            placeholder="Describa detalladamente la acción..."
                        ></textarea>
                        <small class="form-help">Proporcione una descripción clara y detallada</small>
                    </div>
                    
                    <!-- Estado -->
                    <div class="form-group">
                        <label for="estado">Estado</label>
                        <select id="estado" name="estado">
                            <option value="pendiente">Pendiente</option>
                            <option value="en_proceso">En Proceso</option>
                            <option value="completado">Completado</option>
                        </select>
                    </div>
                    
                    <!-- Datos Adicionales -->
                    <div class="form-section-header">
                        <h3>Información Adicional (Opcional)</h3>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="prioridad">Prioridad</label>
                            <select id="prioridad" name="prioridad">
                                <option value="">Sin especificar</option>
                                <option value="baja">Baja</option>
                                <option value="media" selected>Media</option>
                                <option value="alta">Alta</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="area">Área</label>
                            <input 
                                type="text" 
                                id="area" 
                                name="area" 
                                placeholder="Ej: Recursos Humanos"
                            >
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="comentarios">Comentarios Adicionales</label>
                        <textarea 
                            id="comentarios" 
                            name="comentarios" 
                            rows="3"
                            placeholder="Agregue cualquier información adicional relevante..."
                        ></textarea>
                    </div>
                    
                    <!-- Mensajes -->
                    <div id="successMessage" class="success-message" style="display: none;"></div>
                    <div id="errorMessage" class="error-message" style="display: none;"></div>
                    
                    <!-- Botones -->
                    <div class="form-actions">
                        <button type="button" onclick="window.location.href='dashboard.html'" class="btn btn-secondary">
                            Cancelar
                        </button>
                        <button type="submit" class="btn btn-primary" id="submitButton">
                            Guardar Acción
                        </button>
                    </div>
                    
                </form>
            </section>
            
        </div>
    </main>
    
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/formulario.js"></script>
</body>
</html>
